{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<main class="narrow auth"><div class="panel"><h2>Log in</h2>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next|default('') }}">
{{ form.as_p }}<button class="btn btn-dark btn-lg">Log in</button></form>
<p class="fine">New here? <a href="{{ url_for('register') }}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p></div></main>
{% endblock %}
