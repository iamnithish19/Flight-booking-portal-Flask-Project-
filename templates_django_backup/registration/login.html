{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<main class="narrow auth"><div class="panel"><h2>Log in</h2>
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
{{ form.as_p }}<button class="btn btn-dark btn-lg">Log in</button></form>
<p class="fine">New here? <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p></div></main>
{% endblock %}
