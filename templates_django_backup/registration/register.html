{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<main class="narrow auth"><div class="panel"><h2>Create your account</h2>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-dark btn-lg">Sign up</button></form>
<p class="fine">Already registered? <a href="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Log in</a></p></div></main>
{% endblock %}
